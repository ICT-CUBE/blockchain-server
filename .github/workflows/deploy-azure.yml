name: Deploy Blockchain Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: haniumacr.azurecr.io
  IMAGE_NAME: hanium-blockchain
  RESOURCE_GROUP: hanium-rg
  WEBAPP_NAME: hanium-blockchain

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.azure-hardhat
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Azure App Service
        run: |
          az webapp config appsettings delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEBAPP_NAME }}" \
            --setting-names \
              AMOY_DEPLOYER_PRIVATE_KEY \
              AMOY_RPC_URL_PRIMARY \
              CUBE_NFT_ADMIN_ADDRESS \
              CUBE_NFT_MINTER_ADDRESS \
              CUBE_NFT_RELAYER_ADDRESS \
              CUBE_NFT_PAUSER_ADDRESS \
              MINT_SIGNER_PRIVATE_KEY \
              RELAYER_SIGNER_PRIVATE_KEY \
              TRANSACTION_RPC_URL_BACKUP

          az webapp config container set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEBAPP_NAME }}" \
            --container-image-name "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --container-registry-url "https://${{ env.ACR_LOGIN_SERVER }}" \
            --container-registry-user "${{ secrets.ACR_USERNAME }}" \
            --container-registry-password "${{ secrets.ACR_PASSWORD }}"

          az webapp config appsettings set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEBAPP_NAME }}" \
            --settings \
              PORT=3100 \
              WEBSITES_PORT=3100 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
              CUBE_NFT_NETWORK=localhost \
              TRANSACTION_RPC_URL_PRIMARY=http://127.0.0.1:8545 \
              WEB3AUTH_CHAIN_ID=31337 \
              WEB3AUTH_RPC_TARGET=http://127.0.0.1:8545 \
              CONFIRMATION_BLOCKS_REQUIRED=1

          az webapp restart \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEBAPP_NAME }}"

      - name: Verify health endpoint
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error \
              "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
