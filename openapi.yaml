openapi: 3.1.0
info:
  title: ARZONE Blockchain Server Internal API
  version: 1.1.0
  description: >-
    Backend 전용 CUBE NFT 작업 API와 완료 webhook 계약. 2026-08-28 검증 remediation
    (docs/검증-종합-문제-원인-개선안.md §4)에서 실제 구현(blockchain-server commit a116822 이후)과
    동기화됐다. 이 문서는 e2e contract test(`server/test/openapi-contract.e2e-spec.ts`)가 실제 응답을
    schema-validate하는 기준이다.
servers:
  - url: http://blockchain-server:3100
    description: Internal network
tags:
  - name: Health
    description: liveness / readiness
  - name: Wallets
    description: 사용자 수탁 지갑
  - name: NFTs
    description: 온체인 NFT 조회
  - name: Metadata
    description: 불변 Metadata 준비·상태
  - name: Operations
    description: Mint·Transfer 접수와 Operation 조회·취소
  - name: External lifecycle
    description: 출금·재입고·외부 공식 재판매·외부 owner consent challenge
  - name: Operator
    description: 운영자 전용(별도 HMAC key scope) 감사·실패 조회와 제한된 복구
  - name: Webhook
    description: Blockchain Server → Backend 완료 알림
security:
  - ArzoneKeyId: []
    ArzoneTimestamp: []
    ArzoneNonce: []
    ArzoneSignature: []
paths:
  /health:
    get:
      tags: [Health]
      summary: liveness
      operationId: health
      security: []
      responses:
        '200':
          description: 프로세스 기동
          content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}
  /ready:
    get:
      tags: [Health]
      summary: readiness (config·배포 artifact·지갑 provider 상태)
      operationId: ready
      security: []
      responses:
        '200':
          description: 준비 상태
          content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}
  /internal/v1/wallets:
    post:
      tags: [Wallets]
      summary: 사용자 수탁 지갑 조회 또는 생성 (동기)
      operationId: ensureWallet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnsureWalletRequest'}
      responses:
        '200':
          description: 기존 또는 신규 지갑 (생성 여부와 무관하게 200)
          headers: {X-Request-Id: {$ref: '#/components/headers/XRequestId'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/wallets/{userId}:
    get:
      tags: [Wallets]
      summary: 사용자 수탁 지갑 조회
      operationId: getWallet
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 지갑
          content: {application/json: {schema: {$ref: '#/components/schemas/Wallet'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: 미준비 사용자 — code `WALLET_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/nfts/{tokenId}:
    get:
      tags: [NFTs]
      summary: NFT 발행 여부·현재 소유자·tokenURI 조회 (체인 직접 조회, DB 복제 아님)
      operationId: getNft
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: NFT 상태. 미발행은 `minted=false`, `ownerAddress=null`.
          content: {application/json: {schema: {$ref: '#/components/schemas/NftView'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503':
          description: RPC 조회 불가 — code `NFT_LOOKUP_UNAVAILABLE` (미발행과 구분됨, AC-009)
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/metadata:
    post:
      tags: [Metadata]
      summary: 불변 NFT Metadata 준비 (이미지는 Blockchain Server가 직접 pin — 개선안 §5 option 2)
      operationId: prepareMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetadataRequest'}
      responses:
        '200':
          description: 준비 결과 (같은 입력 재요청은 같은 CID — content-addressed idempotent)
          content: {application/json: {schema: {$ref: '#/components/schemas/MetadataPrepared'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413':
          description: 이미지 decoded byte 상한 초과 — code `IMAGE_TOO_LARGE`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '415':
          description: 지원하지 않는 이미지 형식 또는 선언 MIME 불일치 — code `IMAGE_TYPE_UNSUPPORTED`/`IMAGE_TYPE_MISMATCH`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/metadata/{tokenId}:
    get:
      tags: [Metadata]
      summary: Metadata 준비 상태와 의존 CID별 pin/보존 상태
      operationId: getMetadataStatus
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          description: 상태 (미준비 token은 `ready=false`, `dependencies=[]`)
          content: {application/json: {schema: {$ref: '#/components/schemas/MetadataStatus'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/mints:
    post:
      tags: [Operations]
      summary: Mint 작업 접수
      description: >-
        Mint 목적지 주소는 요청으로 받지 않는다. 서버가 userId에 연결된 수탁 지갑을 조회하고 그 주소를
        승인 JWT의 `to` claim과 대조한다. Metadata가 READY가 아니면 409 `METADATA_NOT_READY`.
      operationId: acceptMint
      security: &stateSecurity
        - ArzoneKeyId: []
          ArzoneTimestamp: []
          ArzoneNonce: []
          ArzoneSignature: []
          ArzoneApproval: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MintRequest'}
      responses: &acceptedResponses
        '202':
          description: 작업 접수. Polygon 성공을 의미하지 않음. 동일 idempotencyKey·동일 내용 재전송도 202(같은 operationId).
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationAccepted'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 수탁 지갑 미준비 — code `WALLET_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/transfers:
    post:
      tags: [Operations]
      summary: ARZONE 공식 Transfer 접수 (판매자 수탁 지갑이 현재 owner일 때만 접수 — 검증 D2)
      operationId: acceptTransfer
      security: *stateSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferRequest'}
      responses: *acceptedResponses
  /internal/v1/withdrawals:
    post:
      tags: [External lifecycle]
      summary: 외부 지갑 출금 접수
      operationId: acceptWithdrawal
      security: *stateSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WithdrawalRequest'}
      responses: *acceptedResponses
  /internal/v1/external-consent-challenges:
    post:
      tags: [External lifecycle]
      summary: 외부 current owner가 서명할 EIP-712 OwnerConsent challenge 생성
      operationId: createExternalConsentChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalConsentChallengeRequest'}
      responses:
        '200':
          description: 서명 대상 typed data (domain·types·message). `message.purpose`는 REENTRY=3, EXTERNAL_RESALE=4.
          content: {application/json: {schema: {$ref: '#/components/schemas/ExternalConsentChallenge'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: "`from`이 현재 owner가 아님 — code `EXTERNAL_CONSENT_OWNER_MISMATCH`"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/reentries:
    post:
      tags: [External lifecycle]
      summary: 외부 NFT ARZONE 재입고 접수 (외부 서명을 relayer 시점 eth_call dry-run으로 접수 전 검증 — 검증 D3)
      operationId: acceptReentry
      security: *stateSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReentryRequest'}
      responses: *acceptedResponses
  /internal/v1/external-resales:
    post:
      tags: [External lifecycle]
      summary: 외부 NFT 공식 재판매 접수 (검증 D3 dry-run 동일)
      operationId: acceptExternalResale
      security: *stateSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExternalResaleRequest'}
      responses: *acceptedResponses
  /internal/v1/operations/{operationId}:
    get:
      tags: [Operations]
      summary: Operation과 모든 txHash·receipt 증거·알림 상태 조회 (webhook 전달과 무관하게 동작)
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: 작업 상태
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: code `OPERATION_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/operations/{operationId}/cancel:
    post:
      tags: [Operations]
      summary: 제출 전(REQUESTED) 작업 취소
      operationId: cancelOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200':
          description: 취소된 작업
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: code `OPERATION_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: 이미 제출됨 — code `OPERATION_NOT_CANCELLABLE`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/audit/failures:
    get:
      tags: [Operator]
      summary: 실패 기록 조회 (운영자 key scope)
      operationId: listFailures
      security: &operatorSecurity
        - ArzoneOperatorKeyId: []
          ArzoneTimestamp: []
          ArzoneNonce: []
          ArzoneSignature: []
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: code, in: query, schema: {$ref: '#/components/schemas/FailureCode'}}
        - {name: operationId, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: resolved, in: query, schema: {type: string, enum: ['true', 'false']}}
      responses:
        '200':
          description: 페이지
          content: {application/json: {schema: {$ref: '#/components/schemas/FailureRecordPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/audit/failures/{failureId}/resolve:
    post:
      tags: [Operator]
      summary: 실패 기록 해소 표시
      operationId: resolveFailure
      security: *operatorSecurity
      parameters:
        - {name: failureId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200':
          description: 해소된 기록
          content: {application/json: {schema: {$ref: '#/components/schemas/FailureRecord'}}}
        '404':
          description: code `FAILURE_RECORD_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/audit/records:
    get:
      tags: [Operator]
      summary: 감사 기록 조회 (운영자 key scope)
      operationId: listAuditRecords
      security: *operatorSecurity
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: category, in: query, schema: {type: string, enum: [SECURITY, ADMIN_ACTION, BUSINESS_EVENT]}}
        - {name: operationId, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200':
          description: 페이지
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditRecordPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /internal/v1/audit/operations/{operationId}/resolve-review:
    post:
      tags: [Operator]
      summary: REVIEW_REQUIRED Operation의 제한된 복구 (RELEASE_LOCK → FAILED+lock 해제 / REQUEUE → REQUESTED)
      description: >-
        검증 D3 §7. 서명·broadcast된 attempt가 남아 있으면 409 `OPERATION_HAS_INFLIGHT_ATTEMPT`, REQUEUE는
        attempt가 하나도 없을 때만 허용(409 `OPERATION_ALREADY_SIGNED`). ADMIN_ACTION 감사 기록과
        OPERATOR_RESOLVED 실패 기록이 함께 남는다.
      operationId: resolveReview
      security: *operatorSecurity
      parameters:
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveReviewRequest'}
      responses:
        '200':
          description: 처리 결과
          content: {application/json: {schema: {$ref: '#/components/schemas/ResolveReviewResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: code `OPERATION_NOT_FOUND`
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/Error'}
webhooks:
  blockchainEvent:
    post:
      tags: [Webhook]
      summary: Backend(또는 Mock Receiver)가 수신하는 완료 결과. NOTIFICATION_CALLBACK_URL로 POST.
      description: >-
        Blockchain Server → Backend 방향 HMAC(HMAC_OUTBOUND_*)으로 서명된다. Backend는 `notificationId`로 중복을
        제거하고 2xx로 수락한다. 5xx/429/timeout은 backoff 재시도, 그 외 4xx는 REVIEW_REQUIRED(알림만; Operation은
        ONCHAIN_CONFIRMED 유지).
      security:
        - ArzoneOutboundKeyId: []
          ArzoneTimestamp: []
          ArzoneNonce: []
          ArzoneSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockchainEvent'}
      responses:
        '200':
          description: 신규 또는 중복 알림 수락
          content:
            application/json:
              schema:
                type: object
                required: [notificationId, accepted]
                properties:
                  notificationId: {type: string, format: uuid}
                  accepted: {type: boolean, const: true}
                  duplicate: {type: boolean}
components:
  securitySchemes:
    ArzoneKeyId:
      type: apiKey
      in: header
      name: X-ARZONE-Key-Id
      description: Backend→Blockchain inbound HMAC key id (`HMAC_INBOUND_KEY_ID`)
    ArzoneOperatorKeyId:
      type: apiKey
      in: header
      name: X-ARZONE-Key-Id
      description: 운영자 조회 전용 HMAC key id (`HMAC_OPERATOR_KEY_ID`). inbound key로 운영자 endpoint 호출 시 403 `HMAC_SCOPE_FORBIDDEN`.
    ArzoneOutboundKeyId:
      type: apiKey
      in: header
      name: X-ARZONE-Key-Id
      description: Blockchain→Backend webhook HMAC key id (`HMAC_OUTBOUND_KEY_ID`)
    ArzoneTimestamp: {type: apiKey, in: header, name: X-ARZONE-Timestamp, description: Unix seconds, ±300s}
    ArzoneNonce: {type: apiKey, in: header, name: X-ARZONE-Nonce, description: 요청별 1회성 UUID (key별 재사용 시 401 HMAC_NONCE_REPLAYED)}
    ArzoneSignature:
      type: apiKey
      in: header
      name: X-ARZONE-Signature
      description: 'hex(HMAC-SHA256(secret, "METHOD\npath?sortedQuery\ntimestamp\nnonce\nsha256hex(rawBody)"))'
    ArzoneApproval:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "ARZONE 승인 JWT (HS256, ≤30분). `Authorization: Bearer <jwt>`. claims는 `purpose`별로 다르다(MINT/TRANSFER/WITHDRAWAL/REENTRY/EXTERNAL_RESALE)."
  headers:
    XRequestId:
      description: 서버가 생성해 모든 응답에 붙이는 요청 추적 ID (오류 응답 body의 `requestId`와 동일)
      schema: {type: string, format: uuid}
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TokenId'}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: 입력 오류 — code `VALIDATION_FAILED`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: HMAC 실패 — code `HMAC_MISSING_HEADERS`/`HMAC_INVALID_TIMESTAMP`/`HMAC_TIMESTAMP_OUT_OF_RANGE`/`HMAC_UNKNOWN_KEY`/`HMAC_SIGNATURE_MISMATCH`/`HMAC_NONCE_REPLAYED`; 승인 JWT 누락/무효 — `APPROVAL_JWT_MISSING`/`APPROVAL_JWT_INVALID`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 인증됐으나 권한 없음 — `HMAC_SCOPE_FORBIDDEN`, `APPROVAL_JWT_PURPOSE_MISMATCH`, `APPROVAL_CLAIM_MISMATCH`, `APPROVAL_FROM_MISMATCH`, `APPROVAL_TO_MISMATCH`, `CONSENT_SIGNATURE_INVALID`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 업무 충돌 — `IDEMPOTENCY_CONFLICT`, `APPROVAL_JTI_REPLAY`, `ASSET_LOCK_CONFLICT`, `METADATA_NOT_READY`, `MINT_TOKEN_OWNER_CONFLICT`, `TRANSFER_SELF_TRADE`, `TRANSFER_OWNER_MISMATCH`, `TRANSFER_TOKEN_NOT_MINTED`, `WITHDRAWAL_OWNER_MISMATCH`, `REENTRY_OWNER_MISMATCH`, `EXTERNAL_RESALE_OWNER_MISMATCH`, `CONSENT_EXPIRED`, `CONSENT_OWNER_MISMATCH`, `CONSENT_NONCE_INVALID`, `CONSENT_REJECTED_ON_CHAIN`, `CONTRACT_PAUSED`, `RECIPIENT_CANNOT_RECEIVE`, `TOKEN_NOT_MINTED`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: 체인 조회 불가로 검증되지 않은 요청을 수락하지 않음 — `CONSENT_VERIFICATION_UNAVAILABLE`, `RELAYER_NOT_AUTHORIZED` (재시도 가능)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    TokenId: {type: integer, minimum: 1, maximum: 10000}
    Address:
      type: string
      pattern: '^0x[a-fA-F0-9]{40}$'
      description: Regex는 20-byte hexadecimal 형태만 검사한다. 서버가 ethers로 EIP-55 checksum을 검증하고 정규화해 응답한다.
    NullableAddress:
      oneOf: [{$ref: '#/components/schemas/Address'}, {type: 'null'}]
    Uuid: {type: string, format: uuid}
    DateTime: {type: string, format: date-time, description: 항상 UTC ISO-8601 (검증 D4)}
    NullableDateTime:
      oneOf: [{$ref: '#/components/schemas/DateTime'}, {type: 'null'}]
    HexHash: {type: string, pattern: '^0x[a-fA-F0-9]{64}$'}
    DecimalString: {type: string, pattern: '^[0-9]+$', description: uint256를 10진 문자열로}
    OperationType:
      type: string
      enum: [MINT, TRANSFER, WITHDRAWAL, REENTRY, EXTERNAL_RESALE]
    OperationStatus:
      type: string
      enum: [REQUESTED, SUBMITTED, PENDING, ONCHAIN_CONFIRMED, COMPLETED, FAILED, UNKNOWN, REVIEW_REQUIRED, CANCELLED]
    TxAttemptStatus:
      type: string
      enum: [SIGNED, BROADCAST, CONFIRMED, FAILED, SUPERSEDED, REVIEW_REQUIRED]
    NotificationStatus:
      type: string
      enum: [PENDING, RETRYING, DELIVERED, FAILED, REVIEW_REQUIRED]
    ServiceRightsState:
      type: [string, 'null']
      enum: [EXTERNAL_INACTIVE, ELIGIBLE_FOR_ACTIVATION, null]
      description: >-
        WITHDRAWAL 완료 → EXTERNAL_INACTIVE, REENTRY/EXTERNAL_RESALE 완료 → ELIGIBLE_FOR_ACTIVATION, MINT/TRANSFER → null.
        실제 서비스 권리 활성화/비활성화는 Backend 책임이며 이 값은 파생 보고값이다.
    FailureCode:
      type: string
      enum: [LONG_PENDING, REPEATED_FAILURE, OWNER_MISMATCH, WEBHOOK_FAILED, SUBMISSION_REJECTED, BROADCAST_RETRY_EXHAUSTED, SIGNER_NONCE_GAP, OPERATOR_RESOLVED]
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Readiness:
      type: object
      required: [status, network, cubeNftProxyAddress, walletIntegrationReady, walletProvider]
      properties:
        status: {type: string, const: ready}
        network: {type: string}
        cubeNftProxyAddress: {$ref: '#/components/schemas/Address'}
        walletIntegrationReady: {type: boolean, description: fake adapter면 false}
        walletProvider: {type: string, description: 바인딩된 adapter 이름 (fake-web3auth | web3auth)}
    EnsureWalletRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: {type: string, minLength: 1, maxLength: 128}
    Wallet:
      type: object
      required: [userId, address, provider, providerAdapter, integrationReady, status, createdAt]
      properties:
        userId: {type: string}
        address: {$ref: '#/components/schemas/Address'}
        provider: {type: string, const: WEB3AUTH, description: 논리 custody provider}
        providerAdapter: {type: string, enum: [fake-web3auth, web3auth], description: 실제 바인딩된 adapter (개선안 §4.1)}
        integrationReady: {type: boolean, description: 실제 Web3Auth custody 여부. fake adapter면 false.}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        createdAt: {$ref: '#/components/schemas/DateTime'}
    NftView:
      type: object
      required: [tokenId, minted, ownerAddress, contractAddress, metadataUri, checkedAt, blockNumber]
      properties:
        tokenId: {$ref: '#/components/schemas/TokenId'}
        minted: {type: boolean}
        ownerAddress: {$ref: '#/components/schemas/NullableAddress'}
        contractAddress: {$ref: '#/components/schemas/Address'}
        metadataUri: {type: [string, 'null']}
        checkedAt: {$ref: '#/components/schemas/DateTime'}
        blockNumber: {type: integer, minimum: 0}
    MetadataRequest:
      type: object
      additionalProperties: false
      required: [tokenId, cubeNumber, publicGrade, imageBase64, benefitReferenceId]
      description: >-
        허용 필드만 받는다(allowlist). 그 외 key(userId, 연락처, NFC/QR 값 등)는 400 VALIDATION_FAILED. 이미지는 strict base64,
        decoded ≤ METADATA_IMAGE_MAX_BYTES(기본 2 MiB), PNG/JPEG/WebP/GIF magic byte 검증.
      properties:
        tokenId: {$ref: '#/components/schemas/TokenId'}
        cubeNumber: {type: string, minLength: 1, maxLength: 64}
        publicGrade: {type: string, minLength: 1, maxLength: 64}
        imageBase64: {type: string, minLength: 1, description: strict standard base64}
        imageMimeType: {type: string, enum: [image/png, image/jpeg, image/webp, image/gif], description: 선언 시 bytes와 일치해야 함}
        benefitReferenceId: {type: string, minLength: 1, maxLength: 200, description: 불변 참조만 보관. 혜택 내용·활성화는 Backend 책임.}
    MetadataPrepared:
      type: object
      required: [tokenId, metadataCid, tokenUri, ready]
      properties:
        tokenId: {$ref: '#/components/schemas/TokenId'}
        metadataCid: {type: string}
        tokenUri: {type: string, pattern: '^ipfs://'}
        ready: {type: boolean, description: JSON·image 모든 의존 CID hot-pin 완료 여부. Mint 접수 게이트.}
    MetadataStatus:
      type: object
      required: [tokenId, ready, tokenUri, dependencies]
      properties:
        tokenId: {$ref: '#/components/schemas/TokenId'}
        ready: {type: boolean}
        tokenUri: {type: [string, 'null']}
        dependencies:
          type: array
          items:
            type: object
            required: [cid, kind, pinStatus, preservationStatus, preservationRequestId]
            properties:
              cid: {type: string}
              kind: {type: string, enum: [METADATA_JSON, IMAGE]}
              pinStatus: {type: string, enum: [PENDING, PINNED, FAILED]}
              preservationStatus: {type: string, enum: [PENDING, PRESERVED, FAILED]}
              # Archival provider (Filebase) pin-request id. preservationStatus stays PENDING until a
              # GET /pins/{id} check reports the pin actually `pinned`. Null if the submission failed.
              preservationRequestId: {type: [string, 'null']}
    MintRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, userId, cubeId, tokenId]
      properties:
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        userId: {type: string, minLength: 1}
        cubeId: {type: string, minLength: 1}
        tokenId: {$ref: '#/components/schemas/TokenId'}
      description: 승인 JWT claims — purpose=MINT, tokenId, userId, cubeId, to(수탁 지갑 주소; 서버 조회값과 대조).
    TransferRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, tradeId, sellerUserId, buyerUserId, tokenId]
      properties:
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        tradeId: {type: string, minLength: 1}
        sellerUserId: {type: string, minLength: 1}
        buyerUserId: {type: string, minLength: 1}
        tokenId: {$ref: '#/components/schemas/TokenId'}
      description: 승인 JWT claims — purpose=TRANSFER, tokenId, tradeId, sellerUserId, buyerUserId, from(판매자 수탁 지갑), to(구매자 수탁 지갑).
    WithdrawalRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, userId, tokenId, externalAddress, riskAcknowledgementVersion]
      properties:
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        userId: {type: string, minLength: 1}
        tokenId: {$ref: '#/components/schemas/TokenId'}
        externalAddress: {$ref: '#/components/schemas/Address'}
        riskAcknowledgementVersion: {type: string, minLength: 1, description: 사용자가 확인한 출금 위험 고지 버전 (FR-027)}
      description: 승인 JWT claims — purpose=WITHDRAWAL, tokenId, userId, from(수탁 지갑), to(externalAddress), riskAcknowledgementVersion.
    ExternalConsentChallengeRequest:
      type: object
      additionalProperties: false
      required: [tokenId, from, to, purpose]
      properties:
        tokenId: {$ref: '#/components/schemas/TokenId'}
        from: {$ref: '#/components/schemas/Address', description: 현재 외부 owner}
        to: {$ref: '#/components/schemas/Address', description: "수탁 지갑 (재입고: 본인", 재판매: 구매자)}
        purpose: {type: string, enum: [REENTRY, EXTERNAL_RESALE]}
    ExternalConsentChallenge:
      type: object
      required: [domain, types, message]
      properties:
        domain:
          type: object
          required: [name, version, chainId, verifyingContract]
          properties:
            name: {type: string, const: ARZONE CUBE NFT}
            version: {type: string, const: '1'}
            chainId: {type: integer}
            verifyingContract: {$ref: '#/components/schemas/Address'}
        types:
          type: object
          required: [OwnerConsent]
          properties:
            OwnerConsent:
              type: array
              items:
                type: object
                required: [name, type]
                properties:
                  name: {type: string}
                  type: {type: string}
        message:
          type: object
          required: [tokenId, currentOwner, from, to, purpose, nonce, deadline]
          properties:
            tokenId: {$ref: '#/components/schemas/TokenId'}
            currentOwner: {$ref: '#/components/schemas/Address'}
            from: {$ref: '#/components/schemas/Address'}
            to: {$ref: '#/components/schemas/Address'}
            purpose: {type: integer, enum: [3, 4], description: REENTRY=3, EXTERNAL_RESALE=4}
            nonce: {$ref: '#/components/schemas/DecimalString'}
            deadline: {$ref: '#/components/schemas/DecimalString', description: Unix seconds}
    ReentryRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, userId, tokenId, externalAddress, consentNonce, consentDeadline, externalSignature]
      properties:
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        userId: {type: string, minLength: 1}
        tokenId: {$ref: '#/components/schemas/TokenId'}
        externalAddress: {$ref: '#/components/schemas/Address'}
        consentNonce: {$ref: '#/components/schemas/DecimalString'}
        consentDeadline: {$ref: '#/components/schemas/DecimalString'}
        externalSignature: {type: string, pattern: '^0x[a-fA-F0-9]+$', description: 외부 owner(EOA 또는 ERC-1271)의 OwnerConsent 서명. 접수 전 eth_call dry-run으로 검증되며 서버에는 암호화 저장 후 제출 시 폐기(D8).}
      description: 승인 JWT claims — purpose=REENTRY, tokenId, userId, from(externalAddress), to(수탁 지갑).
    ExternalResaleRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, tradeId, buyerUserId, tokenId, externalSellerAddress, consentNonce, consentDeadline, externalSignature]
      properties:
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        tradeId: {type: string, minLength: 1}
        buyerUserId: {type: string, minLength: 1}
        tokenId: {$ref: '#/components/schemas/TokenId'}
        externalSellerAddress: {$ref: '#/components/schemas/Address'}
        consentNonce: {$ref: '#/components/schemas/DecimalString'}
        consentDeadline: {$ref: '#/components/schemas/DecimalString'}
        externalSignature: {type: string, pattern: '^0x[a-fA-F0-9]+$'}
      description: 승인 JWT claims — purpose=EXTERNAL_RESALE, tokenId, tradeId, buyerUserId, from(externalSellerAddress), to(구매자 수탁 지갑).
    OperationAccepted:
      type: object
      required: [operationId, status, type, tokenId]
      properties:
        operationId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/OperationStatus'}
        type: {$ref: '#/components/schemas/OperationType'}
        tokenId: {$ref: '#/components/schemas/TokenId'}
    TxAttempt:
      type: object
      required: [attemptId, attemptNo, txHash, nonce, status, receiptBlockNumber, receiptBlockHash, receiptStatus, confirmations, broadcastAttemptCount, lastBroadcastError, broadcastAt, confirmedAt, createdAt]
      properties:
        attemptId: {$ref: '#/components/schemas/Uuid'}
        attemptNo: {type: integer, minimum: 1}
        txHash: {$ref: '#/components/schemas/HexHash'}
        nonce: {$ref: '#/components/schemas/DecimalString'}
        status: {$ref: '#/components/schemas/TxAttemptStatus'}
        receiptBlockNumber: {oneOf: [{$ref: '#/components/schemas/DecimalString'}, {type: 'null'}]}
        receiptBlockHash: {oneOf: [{$ref: '#/components/schemas/HexHash'}, {type: 'null'}]}
        receiptStatus: {type: [integer, 'null'], enum: [0, 1, null]}
        confirmations: {type: [integer, 'null'], minimum: 0}
        broadcastAttemptCount: {type: integer, minimum: 0}
        lastBroadcastError: {type: [string, 'null'], description: 'redacted `class/code: reason` — raw tx 등 payload 없음 (D11)'}
        broadcastAt: {$ref: '#/components/schemas/NullableDateTime'}
        confirmedAt: {$ref: '#/components/schemas/NullableDateTime'}
        createdAt: {$ref: '#/components/schemas/DateTime'}
    NotificationState:
      type: object
      required: [notificationId, status, attemptCount, lastAttemptAt, nextAttemptAt, lastError]
      properties:
        notificationId: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/NotificationStatus'}
        attemptCount: {type: integer, minimum: 0}
        lastAttemptAt: {$ref: '#/components/schemas/NullableDateTime'}
        nextAttemptAt: {$ref: '#/components/schemas/NullableDateTime'}
        lastError: {type: [string, 'null']}
    OperationView:
      type: object
      required: [operationId, idempotencyKey, type, status, tokenId, fromAddress, toAddress, reviewReason, failureCode, currentTxHash, confirmations, finalOwnerAddress, serviceRightsState, txAttempts, notification, createdAt, updatedAt, submittedAt, onchainConfirmedAt, completedAt]
      properties:
        operationId: {$ref: '#/components/schemas/Uuid'}
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        type: {$ref: '#/components/schemas/OperationType'}
        status: {$ref: '#/components/schemas/OperationStatus'}
        tokenId: {$ref: '#/components/schemas/TokenId'}
        fromAddress: {$ref: '#/components/schemas/NullableAddress'}
        toAddress: {$ref: '#/components/schemas/NullableAddress'}
        reviewReason: {type: [string, 'null'], description: REVIEW_REQUIRED 사유 (예 OWNER_MISMATCH_AT_SUBMIT, CONSENT_REJECTED_ON_SUBMIT, BROADCAST_RETRY_EXHAUSTED, RBF_LIMIT_EXCEEDED)}
        failureCode: {type: [string, 'null'], description: FAILED 사유 (예 ALL_ATTEMPTS_REVERTED, OPERATOR_RELEASE_LOCK)}
        currentTxHash: {oneOf: [{$ref: '#/components/schemas/HexHash'}, {type: 'null'}], description: 확정 attempt의 txHash, 없으면 최신 attempt의 txHash}
        confirmations: {type: integer, minimum: 0}
        finalOwnerAddress: {$ref: '#/components/schemas/NullableAddress', description: 확정 시 ownerOf 재확인값}
        serviceRightsState: {$ref: '#/components/schemas/ServiceRightsState'}
        txAttempts: {type: array, items: {$ref: '#/components/schemas/TxAttempt'}, description: 최초·교체 제출 전체 (AC-021)}
        notification: {oneOf: [{$ref: '#/components/schemas/NotificationState'}, {type: 'null'}]}
        createdAt: {$ref: '#/components/schemas/DateTime'}
        updatedAt: {$ref: '#/components/schemas/DateTime'}
        submittedAt: {$ref: '#/components/schemas/NullableDateTime'}
        onchainConfirmedAt: {$ref: '#/components/schemas/NullableDateTime'}
        completedAt: {$ref: '#/components/schemas/NullableDateTime'}
    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1, maxLength: 200}
    ResolveReviewRequest:
      type: object
      additionalProperties: false
      required: [action, note, operator]
      properties:
        action: {type: string, enum: [RELEASE_LOCK, REQUEUE]}
        note: {type: string, minLength: 1, maxLength: 200}
        operator: {type: string, minLength: 1, maxLength: 128, description: 감사 기록 actor}
    ResolveReviewResponse:
      type: object
      required: [operationId, previousStatus, status, lockReleased, action]
      properties:
        operationId: {$ref: '#/components/schemas/Uuid'}
        previousStatus: {type: string, const: REVIEW_REQUIRED}
        status: {$ref: '#/components/schemas/OperationStatus'}
        lockReleased: {type: boolean}
        action: {type: string, enum: [RELEASE_LOCK, REQUEUE]}
    FailureRecord:
      type: object
      required: [id, code, operationId, attemptId, notificationId, details, occurredAt, resolvedAt, resolution]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {$ref: '#/components/schemas/FailureCode'}
        operationId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        attemptId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        notificationId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        details: {type: [object, 'null'], additionalProperties: true, description: allowlist projection + 금지 key 자동 redaction}
        occurredAt: {$ref: '#/components/schemas/DateTime'}
        resolvedAt: {$ref: '#/components/schemas/NullableDateTime'}
        resolution: {type: [string, 'null']}
    FailureRecordPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FailureRecord'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    AuditRecord:
      type: object
      required: [id, category, actor, action, target, requestId, operationId, details, occurredAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        category: {type: string, enum: [SECURITY, ADMIN_ACTION, BUSINESS_EVENT]}
        actor: {type: string}
        action: {type: string}
        target: {type: [string, 'null']}
        requestId: {type: [string, 'null']}
        operationId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        details: {type: [object, 'null'], additionalProperties: true}
        occurredAt: {$ref: '#/components/schemas/DateTime'}
    AuditRecordPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditRecord'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
    BlockchainEvent:
      type: object
      required: [notificationId, operationId, idempotencyKey, operationType, tokenId, finalStatus, finalOwnerAddress, txHash, blockNumber, blockHash, confirmations, serviceRightsState, confirmedAt]
      properties:
        notificationId: {$ref: '#/components/schemas/Uuid'}
        operationId: {$ref: '#/components/schemas/Uuid'}
        idempotencyKey: {$ref: '#/components/schemas/Uuid'}
        operationType: {$ref: '#/components/schemas/OperationType'}
        tokenId: {$ref: '#/components/schemas/TokenId'}
        finalStatus: {type: string, const: ONCHAIN_CONFIRMED}
        finalOwnerAddress: {$ref: '#/components/schemas/Address'}
        txHash: {$ref: '#/components/schemas/HexHash'}
        blockNumber: {type: integer, minimum: 0}
        blockHash: {$ref: '#/components/schemas/HexHash'}
        confirmations: {type: integer, minimum: 1, description: 확정 판정 시점 confirmations (≥ CONFIRMATION_BLOCKS_REQUIRED, 기본 5)}
        serviceRightsState: {$ref: '#/components/schemas/ServiceRightsState'}
        confirmedAt: {$ref: '#/components/schemas/DateTime'}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string, description: 서버 생성 요청 ID (X-Request-Id 응답 헤더와 동일)}
